services:
  - type: web
    name: agrovision-ai
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements-model.txt && python3 scripts/download_model.py"
    startCommand: "gunicorn --bind 0.0.0.0:$PORT --workers 1 --timeout 120 app:app"
    envVars:
      - key: HF_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.0"
